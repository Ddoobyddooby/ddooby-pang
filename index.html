<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Ddooby-Pang</title>
    <!-- 홈 화면에 추가 (PLAN 7.4). 아이콘은 assets/app-icon/icon-only.png를 sips로 줄인 것 -->
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#bfe4ff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ddooby-Pang" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <style>
      @font-face {
        font-family: 'Jua';
        src: url('./fonts/Jua-subset.woff2') format('woff2');
        font-display: block;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
      html {
        /* src/config.ts THEME.sky와 같은 값. 캔버스 밖 여백(letterbox)을 하늘로 잇는다 */
        background: linear-gradient(to bottom, #bfe4ff, #ffd9ea) no-repeat fixed;
      }
      #game {
        /* 노치·내비게이션 바를 피한다. padding이 아니라 요소 크기 자체를 안전 영역 안쪽으로 둔다
           (Phaser는 부모 clientHeight로 캔버스를 만드는데 padding이 포함돼 안전 영역만큼 밀려 나간다).
           하늘 그라데이션은 html에 있어 그 뒤까지 이어진다 */
        position: fixed;
        top: env(safe-area-inset-top);
        right: env(safe-area-inset-right);
        bottom: env(safe-area-inset-bottom);
        left: env(safe-area-inset-left);
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
