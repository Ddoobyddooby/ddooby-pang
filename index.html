<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>ddooby-pang</title>
    <link rel="icon" href="data:," />
    <style>
      @font-face {
        font-family: 'Jua';
        src: url('./fonts/Jua-subset.woff2') format('woff2');
        font-display: block;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
      html {
        /* src/config.ts THEME.sky와 같은 값. 캔버스 밖 여백(letterbox)을 하늘로 잇는다 */
        background: linear-gradient(to bottom, #bfe4ff, #ffd9ea) no-repeat fixed;
      }
      #game {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        /* 노치·홈 바를 피한다. 하늘 그라데이션은 html에 있어 그 뒤까지 이어진다 */
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
